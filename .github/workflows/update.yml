name: Update site

on:
  schedule:
    - cron: '0 15 * * 1'   # Monday ~10 AM ET: Sunday results and props graded, fresh injury news for Monday night
    - cron: '0 12 * * 2'   # Tuesday ~7 AM ET: Monday night results are in
    - cron: '17 12 * * 4'  # Thursday ~7 AM ET: any Wednesday-night final, before Thursday's early kickoff
    - cron: '0 21 * * 4'   # Thursday ~4 PM ET: Thursday injury reports
    - cron: '17 12 * * 5'  # Friday ~7 AM ET: Thursday night final
    - cron: '0 21 * * 5'   # Friday ~4 PM ET: college picks and lines logged before Saturday's games
    - cron: '17 0 * * 6'   # Friday ~7 PM ET: late Friday NFL designations
    - cron: '0 16 * * 6'   # Saturday ~11 AM ET: final injury reports for Sunday
    - cron: '0 16 * * 0'   # Sunday ~11 AM ET: Saturday's college results graded (the college data updates Sunday morning)
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - 'data/overrides.json'
      - 'data/news.json'
      - 'src/**'
      - 'pipeline/**'
      - 'build_site.py'

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    # pushes from a Claude session already include a fresh build, so only rebuild for edits made on GitHub
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'Claude-Session') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Restore past seasons' data
        uses: actions/cache@v4
        with:
          path: |
            data/*_201[6-9].csv*
            data/*_202[0-5].csv*
          key: nflverse-past-seasons-v1

      - run: pip install -r requirements.txt

      - name: Download data and rebuild
        run: bash scripts/update.sh

      - name: Publish changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/*.json collab/briefing.md
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Update site $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git pull --rebase --autostash
          git push
